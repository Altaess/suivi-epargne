name: Cours de clôture
on:
  schedule:
    - cron: "45 17 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch_prices.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || (git commit -m "Cours $(date -u +%F)" && git push)
